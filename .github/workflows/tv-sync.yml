name: TV Watchlist Sync

on:
  # Fire after the Lean Radar scan completes — the only source the sync
  # consumes now that Smart Radar - BUY/WATCH were dropped from TV sync
  # (2026-07-25; Smart Radar's Telegram report is unaffected). Lean runs
  # twice on weekdays (20:15 UTC primary + 23:45 UTC settled-close refresh);
  # both completions trigger a sync, which is fine — the second just picks
  # up corrected closes.
  workflow_run:
    workflows: ["Lean Radar - Daily Scan"]
    types: [completed]

  # Manual trigger for testing / catch-up runs.
  workflow_dispatch:

jobs:
  tv-sync:
    # Only run when the upstream scan succeeded (skip on failure/cancel).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to commit tv-state.json back to repo
      actions: read     # to download artifacts from other workflows via gh CLI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # download-artifact@v4 only looks inside the CURRENT run by default — the
      # tv-sync-state artifact was uploaded by a PREVIOUS run, so cross-run access
      # needs an explicit run-id. Query the artifacts API directly for the latest
      # non-expired "tv-sync-state" artifact (sorted newest-first) and use its
      # owning run — this doesn't care which workflow produced it, so a one-off
      # bootstrap/seed run's artifact is picked up exactly like a normal one.
      - name: Find latest tv-sync-state artifact
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts" \
            --jq '[.artifacts[] | select(.name=="tv-sync-state" and .expired==false)] | first | .workflow_run.id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # Restore persisted state (ticker history, exchange registry) from that run.
      # On first run ever, run_id is empty and this step is skipped (no-op).
      - name: Restore TV sync state
        if: steps.find-run.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: tv-sync-state
          path: /home/runner/.cache/svr-tv-sync/
          run-id: ${{ steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # artifact may have expired (90-day retention)

      # Health check BEFORE the sync, in the SAME job — this ordering is the
      # whole point. It evaluates the watchlist as it stands right now (from the
      # committed results/tv-state.json) and writes prune-queue.json into the
      # cache dir restored above; the sync step below then consumes it in this
      # same run. Until 2026-07-27 this script only ever ran on Kobi's Mac, so
      # its queue never reached the runner and the ≥8% prune path could not fire
      # at all — see cabinet outputs/2026-07-26-two-radar-improvement.md (F3).
      #
      # Same-run consumption is safe: sync-tv-watchlist.ts only prunes a queued
      # ticker when it is NOT in today's fresh target, so a stock that broke down
      # and immediately re-signalled is kept.
      #
      # continue-on-error + the script's own catch: health is advisory. If it
      # fails or Yahoo is down, the sync must still run — it just won't prune.
      # Telegram is gated to the PRIMARY Lean run only (20:15 UTC). Lean also runs
      # a 23:45 settled-close refresh, and every Lean completion triggers this
      # workflow — so until 2026-08-08 the same health report was sent TWICE per
      # trading day, ~3.5h apart, with near-identical content. The prune queue is
      # still written on both runs (that part is genuinely useful on the refresh,
      # which has corrected closes); only the notification is suppressed.
      #
      # workflow_dispatch has no triggering run, so TRIGGER_HOUR is empty and the
      # report sends — a manual run is always an explicit request to see it.
      - name: Watchlist health check (writes prune queue)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRIGGER_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          TRIGGER_HOUR="${TRIGGER_STARTED_AT:11:2}"
          if [ -n "$TRIGGER_HOUR" ] && [ "$TRIGGER_HOUR" -ge 22 ] 2>/dev/null; then
            echo "Triggered by the ${TRIGGER_HOUR}:xx UTC settled-close Lean run — writing prune queue without Telegram."
            node scripts/watchlist-health.mjs
          else
            node scripts/watchlist-health.mjs --telegram
          fi

      # Decode the TV_COOKIES secret (base64 JSON) and write to temp file.
      - name: Prepare TradingView cookies
        run: |
          echo "${{ secrets.TV_COOKIES }}" | base64 -d > /tmp/tv-cookies.json
          echo "TV_COOKIES_FILE=/tmp/tv-cookies.json" >> $GITHUB_ENV

      - name: Run TV sync
        env:
          CI: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TV_COOKIES_FILE: ${{ env.TV_COOKIES_FILE }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: npm run tv-sync

      # Persist state files for the next run (ticker history, first-seen, exchange registry).
      - name: Save TV sync state
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: tv-sync-state
          path: /home/runner/.cache/svr-tv-sync/
          retention-days: 90
          overwrite: true

      # Commit tv-state.json back to repo so telegram-mcp can read it.
      - name: Commit tv-state.json
        if: success() && hashFiles('results/tv-state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/tv-state.json
          if git diff --staged --quiet; then
            echo "tv-state.json unchanged — nothing to commit"
          else
            git commit -m "chore: update tv-state.json (tv-sync $(date -u +%Y-%m-%d))"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=❌ TV Sync (GHA) failed. Check GitHub Actions."
