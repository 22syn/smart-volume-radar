name: Branch Drift

# The two radars run from two branches (Smart on `main`, Lean on `stable`) and
# each carries its own copy of the shared layer. A fix applied to one silently
# does not reach the other — PR #49 (SMA/RSI → trading-signals) landed on `main`
# only and `stable` kept the hand-rolled version unnoticed for two months.
#
# This job makes that drift loud. It does NOT try to prevent divergence: if a
# file is meant to differ, remove it from config/shared-files.txt and say why.
#
# Decision: cabinet decisions-log, 2026-07-26 — "accept the split, add a drift
# guard". Full analysis: outputs/2026-07-26-two-radar-improvement.md.

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      # Full history is not needed, but both branch tips are — a shallow
      # single-branch checkout cannot see the other side of the comparison.
      # SHA-pinned per the hardening convention established in bd6996b.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Fetch both radar branches
        run: git fetch --no-tags origin main stable

      # Pick what to compare against what.
      #
      # On push the branch tips ARE the merged state, so origin/main vs
      # origin/stable is exactly right.
      #
      # On pull_request, comparing the two tips would ignore the PR entirely and
      # report a green check that means nothing — the drift would only surface
      # after merge, on somebody else's push. So compare the PR's own head
      # against the OPPOSITE branch from the one it targets.
      - name: Resolve comparison refs
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.base_ref }}" = "main" ]; then
              other=origin/stable
            else
              other=origin/main
            fi
            echo "base=HEAD"   >> "$GITHUB_OUTPUT"
            echo "head=$other" >> "$GITHUB_OUTPUT"
            echo "Comparing this PR against $other"
          else
            echo "base=origin/main"   >> "$GITHUB_OUTPUT"
            echo "head=origin/stable" >> "$GITHUB_OUTPUT"
          fi

      # Pure git + bash: no npm install, so this reports in seconds and cannot
      # be masked by a dependency problem.
      - name: Check shared files for drift
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD_REF: ${{ steps.refs.outputs.head }}
        run: ./scripts/check-branch-drift.sh --suggest
